name: Mise à jour des données

# Collecte toutes les sources et publie le site sur GitHub Pages.
# Déclenché de l'extérieur par cron-job.org (workflow_dispatch) à chaque heure pile, et à chaque push sur main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boussole
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'historique (branche state)
        # Garde-fou : la sauvegarde réécrit toute la branche state (dont paper/, l'état de l'agent de paper trading).
        # Si la branche existe mais n'a pas pu être récupérée, on s'arrête au lieu de la remplacer par un état vide.
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
          else
            echo "Pas encore d'historique : première exécution."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collecter les données et construire le site
        run: node scripts/snapshot.mjs --site
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}

      - name: Sauvegarder l'historique (branche state)
        run: |
          cd data
          git init -q -b state
          git add -A
          git -c user.name="boussole-bot" -c user.email="boussole-bot@users.noreply.github.com" commit -qm "état $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Déploiement dans un job séparé, comme le modèle officiel de GitHub Pages.
  # Dans le même job, deploy-pages partait une seconde après l'envoi et ne voyait parfois pas encore l'artefact
  # (« No artifacts named "github-pages" were found »), alors qu'il était bien présent dans l'exécution.
  # Un second essai couvre le cas où l'artefact n'est toujours pas visible.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attendre avant un second essai
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
