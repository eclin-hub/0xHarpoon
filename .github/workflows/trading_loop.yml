name: Agent de paper trading

# Un cycle par heure (SPEC.md) : valorisation, funding, résolutions, stops, notes des baleines, candidats,
# vote des LLM sur événement, exécution simulée, métriques. L'état vit dans la branche `state` (dossier paper/).
# Déclenché de l'extérieur par cron-job.org (workflow_dispatch) à :10 chaque heure, après « Mise à jour des données » (:00).
on:
  workflow_dispatch:
    inputs:
      force_x:
        description: "Forcer la collecte X même si la dernière a moins de 45 min"
        type: boolean
        default: false

permissions:
  contents: write   # pousser la branche state (GitHub Models, retiré le 30/07/2026, n'est plus utilisé)

# Même groupe que « Mise à jour des données » : les deux workflows réécrivent la branche state,
# ils ne doivent jamais tourner en même temps.
concurrency:
  group: boussole
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'état (branche state)
        # Garde-fou : si la branche existe mais n'a pas pu être récupérée, on s'arrête avant de pousser quoi que ce soit.
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
            if [ ! -f data/last.json ] && [ ! -f data/paper/portfolio_state.json ]; then
              echo "::error::Branche state récupérée mais vide : arrêt pour ne pas écraser l'historique."
              exit 1
            fi
          else
            echo "Pas encore de branche state : premier cycle."
          fi

      - name: Récupérer les propositions border (branche border, facultatif)
        run: |
          mkdir -p data/paper
          if git ls-remote --exit-code --heads origin border >/dev/null; then
            git fetch --depth=1 origin border
            git show FETCH_HEAD:border_proposals.json > data/paper/border_proposals.json || echo "Pas de border_proposals.json dans la branche border."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      # Collecte X : twitter-cli lit X avec les cookies d'une session (secrets X_AUTH_TOKEN et X_CT0).
      # agent-reach ne prend pas ces cookies (sa recherche X passe par un navigateur connecté à la main) : il n'est pas
      # installé ici. Une installation ratée ne bloque pas le cycle : le flux X reste neutre.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/x-requirements.txt

      - name: Installer twitter-cli (collecte X)
        continue-on-error: true
        run: pip install --disable-pip-version-check --quiet -r .github/x-requirements.txt && twitter --help >/dev/null && echo "twitter-cli installé."

      - name: Cycle horaire
        run: node scripts/paper.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPER_LLM_PROVIDERS: ${{ vars.PAPER_LLM_PROVIDERS }}
          # Collecte X (page X Alpha). Cookies de session lus par twitter-cli ; GitHub masque les secrets dans les journaux
          # et aucune étape ne les affiche. Collecte réutilisée si la dernière réussie a moins de 45 min (anti-ban),
          # sauf lancement manuel avec « force_x ». Cookies expirés : flux neutre, raison dans le journal, cycle poursuivi.
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}
          X_FORCE: ${{ inputs.force_x }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          X_REACH_CMD: ${{ vars.X_REACH_CMD }}
          X_TIER1: ${{ vars.X_TIER1 }}

      - name: Sauvegarder l'état (branche state)
        run: |
          cd data
          git init -q -b state
          git add -A
          git -c user.name="boussole-bot" -c user.email="boussole-bot@users.noreply.github.com" commit -qm "paper $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
