name: Agent de paper trading

# Un cycle par heure (SPEC.md) : valorisation, funding, résolutions, stops, notes des baleines, candidats,
# vote des LLM sur événement, exécution simulée, métriques. L'état vit dans la branche `state` (dossier paper/).
# GitHub lance les tâches planifiées « au mieux » : le cycle peut partir avec quelques minutes de retard.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # pousser la branche state
  models: read      # GitHub Models avec le GITHUB_TOKEN du workflow

# Même groupe que « Mise à jour des données » : les deux workflows réécrivent la branche state,
# ils ne doivent jamais tourner en même temps.
concurrency:
  group: boussole
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'état (branche state)
        # Garde-fou : si la branche existe mais n'a pas pu être récupérée, on s'arrête avant de pousser quoi que ce soit.
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
            if [ ! -f data/last.json ] && [ ! -f data/paper/portfolio_state.json ]; then
              echo "::error::Branche state récupérée mais vide : arrêt pour ne pas écraser l'historique."
              exit 1
            fi
          else
            echo "Pas encore de branche state : premier cycle."
          fi

      - name: Récupérer les propositions border (branche border, facultatif)
        run: |
          mkdir -p data/paper
          if git ls-remote --exit-code --heads origin border >/dev/null; then
            git fetch --depth=1 origin border
            git show FETCH_HEAD:border_proposals.json > data/paper/border_proposals.json || echo "Pas de border_proposals.json dans la branche border."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Cycle horaire
        run: node scripts/paper.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPER_LLM_PROVIDERS: ${{ vars.PAPER_LLM_PROVIDERS }}

      - name: Sauvegarder l'état (branche state)
        run: |
          cd data
          git init -q -b state
          git add -A
          git -c user.name="boussole-bot" -c user.email="boussole-bot@users.noreply.github.com" commit -qm "paper $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
